# Fonte única do awesome-mcp-brasil.
# O README.md é GERADO a partir deste arquivo por scripts/build_readme.py — não edite o README na mão.
#
# Campos de cada servidor:
#   nome              nome curto (como aparece na tabela)
#   repo              owner/repo no GitHub (opcional para guias/sites)
#   url               link canônico (GitHub, docs ou artigo)
#   descricao         1 linha em pt-BR
#   categoria         id de uma das categorias abaixo
#   pacote            npm | pypi | oci | mcpb | remoto | git   (string ou lista) — "remoto" = servidor hospedado (HTTP/SSE), "git" = só clonar
#   exige_chave       sim | nao  — precisa de conta, token, certificado ou pagamento para funcionar?
#   registro_oficial  sim | nao  — está em registry.modelcontextprotocol.io?
#   registro_nome     nome no registro oficial (opcional, ex.: io.github.owner/repo)
#   tipo              servidor (padrão) | skill | guia

categorias:
  - id: dados-publicos
    nome: Dados públicos
    descricao: CNPJ, CEP, IBGE, Banco Central, feriados, B3 e outras APIs abertas do Brasil.
  - id: fiscal
    nome: Fiscal / Tributário
    descricao: NF-e, NFS-e, SPED, Simples Nacional, Reforma Tributária (IBS/CBS).
  - id: juridico
    nome: Jurídico / Legislativo
    descricao: Câmara, Senado, DataJud/CNJ, tribunais, LexML, jurisprudência.
  - id: comercio-saas
    nome: Comércio & SaaS BR
    descricao: ERPs, e-commerce, marketplaces e plataformas brasileiras (Hotmart, Conta Azul, Bling, Omie, Mercado Livre…).
  - id: pagamentos
    nome: Pagamentos (Pix)
    descricao: Pix, boleto, Open Finance, gateways e bancos brasileiros.
  - id: governo
    nome: Eleições / Governo
    descricao: TSE, Portal da Transparência, PNCP (licitações), diários oficiais.
  - id: skills
    nome: Skills & prompts BR
    descricao: Skills de agente (Claude Code, Cursor) e plugins em português ou para plataformas brasileiras.
  - id: guias
    nome: Guias em português
    descricao: Documentação, artigos e tutoriais sobre MCP em pt-BR.

